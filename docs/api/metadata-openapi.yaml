openapi: 3.0.0
info:
  title: rustBangumi Metadata Service API
  description: |
    Bangumi.tv metadata 查詢服務，依 external id（`bgm/{subject}`）查詢，不做標題模糊搜尋。
    Stateless 服務，呼叫方需自行快取結果。
    服務啟動時向 Core 以 module_type=metadata 註冊。
  version: 0.1.0
  contact:
    name: rustBangumi Project
  license:
    name: MIT

servers:
  - url: 'http://{host}:{port}'
    description: rustBangumi Metadata Service
    variables:
      host:
        default: localhost
        description: 主機名稱（Docker 環境請改為 metadata）
      port:
        default: '8005'
        description: 服務端口

tags:
  - name: Health
    description: 服務健康檢查
  - name: Enrich
    description: Metadata 查詢（bangumi.tv）

paths:
  /health:
    get:
      tags:
        - Health
      summary: 健康檢查
      operationId: getHealth
      responses:
        '200':
          description: 服務正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /enrich/anime:
    post:
      tags:
        - Enrich
      summary: 查詢一季的 metadata 與所屬系列
      description: |
        依 external id 從 bangumi.tv 取得一季的名稱、簡介、播出期間與封面。
        並沿前傳鏈（只走 TV / WEB 動畫）找到第一季，回傳系列名稱與系列內容；劇場版、OVA 自成一部。
        系列名稱：第一季往後第一個非空中文名去掉季別標記，沒有中文名時用第一季原名。
        服務註冊時宣告 `capabilities.namespaces = ["bgm"]`。
      operationId: enrichAnime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalIdRequest'
            example:
              namespace: "bgm"
              external_id: "548818"
      responses:
        '200':
          description: 一季的內容與系列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichAnimeResponse'
        '404':
          description: namespace 不是 bgm，或 subject 不存在
        '502':
          description: bangumi.tv 查詢失敗

  /enrich/episodes:
    post:
      tags:
        - Enrich
      summary: 查詢集數 metadata
      description: |
        依 external id 與集數取得集數標題與簡介。集數先比對該季集數（ep），
        找不到再比對跨季連續編號（sort），例如第二季第 1 集也可以用 14 查詢。
      operationId: enrichEpisodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExternalIdRequest'
                - type: object
                  required: [episode_no]
                  properties:
                    episode_no:
                      type: integer
                      example: 1
      responses:
        '200':
          description: 集數 metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichEpisodesResponse'
        '404':
          description: namespace 不是 bgm，或集數不存在
        '502':
          description: bangumi.tv 查詢失敗

components:
  schemas:
    CoverImageInfo:
      type: object
      required:
        - url
        - source
      properties:
        url:
          type: string
          format: uri
          example: "https://lain.bgm.tv/pic/cover/l/xx.jpg"
        source:
          type: string
          description: 圖片來源
          example: "bangumi"

    ExternalIdRequest:
      type: object
      required: [namespace, external_id]
      properties:
        namespace:
          type: string
          example: "bgm"
        external_id:
          type: string
          example: "548818"

    SeriesInfo:
      type: object
      description: 系列（第一季）的內容
      properties:
        namespace:
          type: string
          example: "bgm"
        external_id:
          type: string
          description: 第一季的 subject id
          example: "430699"
        title:
          type: string
          description: 各季共用的系列名稱
          example: "金牌得主"
        original_title:
          type: string
          example: "メダリスト"
        summary:
          type: string
          nullable: true
        air_date:
          type: string
          nullable: true
          example: "2025-01-05"
        cover_images:
          type: array
          items:
            $ref: '#/components/schemas/CoverImageInfo'

    EnrichAnimeResponse:
      type: object
      properties:
        namespace:
          type: string
          example: "bgm"
        external_id:
          type: string
          example: "548818"
        title:
          type: string
          description: 原名
          example: "メダリスト 第2期"
        title_cn:
          type: string
          description: 中文名（可能為空字串）
          example: "金牌得主 第二季"
        summary:
          type: string
          nullable: true
        air_date:
          type: string
          nullable: true
          example: "2026-01-24"
        end_date:
          type: string
          nullable: true
          description: 播放結束（取自 infobox）
          example: "2026-03-21"
        total_episodes:
          type: integer
          nullable: true
          example: 9
        platform:
          type: string
          example: "TV"
        cover_images:
          type: array
          items:
            $ref: '#/components/schemas/CoverImageInfo'
        series:
          $ref: '#/components/schemas/SeriesInfo'

    EnrichEpisodesResponse:
      type: object
      properties:
        episode_no:
          type: integer
          description: 集數編號
          example: 5
        title:
          type: string
          nullable: true
          description: 集數標題（日文）
        title_cn:
          type: string
          nullable: true
          description: 集數標題（中文）
        air_date:
          type: string
          nullable: true
          description: 播出日期（YYYY-MM-DD）
        summary:
          type: string
          nullable: true
          description: 集數簡介
