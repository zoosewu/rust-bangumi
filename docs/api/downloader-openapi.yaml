openapi: 3.0.0
info:
  title: rustBangumi Downloader (qBittorrent) Service API
  description: |
    qBittorrent Downloader 服務 API 規格。
    支援 magnet link（優先）及 .torrent HTTP URL 兩種下載方式。
    服務啟動時向 Core 註冊，廣告支援的 DownloadType（Magnet、Torrent）。
  version: 0.2.0
  contact:
    name: rustBangumi Project
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: 'http://{host}:{port}'
    description: rustBangumi qBittorrent Downloader
    variables:
      host:
        default: localhost
        description: 主機名稱（Docker 環境請改為 downloader-qbittorrent）
      port:
        default: '8002'
        description: 服務端口

tags:
  - name: Health
    description: 服務健康檢查
  - name: Downloads
    description: 下載任務管理
  - name: Config
    description: 服務設定

paths:
  /health:
    get:
      tags:
        - Health
      summary: 健康檢查
      operationId: getHealth
      responses:
        '200':
          description: 服務正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /downloads:
    post:
      tags:
        - Downloads
      summary: 批次新增下載任務
      description: 批次新增 torrent 下載任務，每個項目可為 magnet link 或 .torrent HTTP URL
      operationId: batchAddDownloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDownloadRequest'
            examples:
              magnet:
                summary: 使用 magnet link
                value:
                  items:
                    - url: "magnet:?xt=urn:btih:abc123def456&dn=Example+Torrent"
                      save_path: "/downloads/bangumi/example"
              torrentUrl:
                summary: 使用 .torrent URL
                value:
                  items:
                    - url: "https://mikanani.me/Download/20250101/abc123def456.torrent"
                      save_path: "/downloads/bangumi/example"
      responses:
        '200':
          description: 批次新增結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDownloadResponse'

    get:
      tags:
        - Downloads
      summary: 查詢下載狀態
      description: 根據 hash 列表批次查詢下載任務的當前狀態、進度與大小
      operationId: queryDownloadStatus
      parameters:
        - name: hashes
          in: query
          required: true
          description: 以逗號分隔的 torrent hash 列表
          schema:
            type: string
          example: "abc123def456,789xyz000111"
      responses:
        '200':
          description: 下載狀態查詢結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusQueryResponse'

  /downloads/cancel:
    post:
      tags:
        - Downloads
      summary: 批次取消下載
      operationId: batchCancelDownloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCancelRequest'
      responses:
        '200':
          description: 批次取消結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCancelResponse'

  /downloads/{hash}/pause:
    post:
      tags:
        - Downloads
      summary: 暫停下載
      operationId: pauseDownload
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
          example: "abc123def456"
      responses:
        '200':
          description: 已暫停

  /downloads/{hash}/resume:
    post:
      tags:
        - Downloads
      summary: 恢復下載
      operationId: resumeDownload
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
          example: "abc123def456"
      responses:
        '200':
          description: 已恢復

  /downloads/{hash}:
    delete:
      tags:
        - Downloads
      summary: 刪除下載
      operationId: deleteDownload
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
          example: "abc123def456"
        - name: delete_files
          in: query
          required: false
          description: 是否同時刪除已下載的檔案（預設 false）
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 已刪除

  /config/credentials:
    post:
      tags:
        - Config
      summary: 設定 qBittorrent 登入憑證
      description: 動態更新連接 qBittorrent WebUI 所需的帳號密碼
      operationId: setCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCredentialsRequest'
            examples:
              default:
                value:
                  username: "admin"
                  password: "adminadmin"
      responses:
        '200':
          description: 憑證已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Credentials updated successfully"

components:
  schemas:
    BatchDownloadRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DownloadItem'

    DownloadItem:
      type: object
      required:
        - url
        - save_path
      properties:
        url:
          type: string
          description: Magnet link 或 .torrent HTTP URL
          example: "magnet:?xt=urn:btih:abc123def456&dn=Example+Torrent"
        save_path:
          type: string
          example: "/downloads/bangumi/example"

    BatchDownloadResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DownloadResult'

    DownloadResult:
      type: object
      required:
        - url
        - status
      properties:
        url:
          type: string
          example: "magnet:?xt=urn:btih:abc123def456"
        hash:
          type: string
          nullable: true
          description: Torrent hash（成功時回傳）
          example: "abc123def456"
        status:
          type: string
          enum: [success, failed]
          example: "success"
        reason:
          type: string
          nullable: true
          description: 失敗原因
          example: null

    StatusQueryResponse:
      type: object
      required:
        - statuses
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/DownloadStatus'

    DownloadStatus:
      type: object
      required:
        - hash
        - status
        - progress
        - size
      properties:
        hash:
          type: string
          example: "abc123def456"
        status:
          type: string
          description: downloading / completed / paused / error
          example: "downloading"
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.45
        size:
          type: integer
          format: int64
          description: 檔案總大小（bytes）
          example: 1073741824
        content_path:
          type: string
          nullable: true
          description: 下載完成後的檔案路徑
          example: "/downloads/bangumi/example/episode01.mkv"

    BatchCancelRequest:
      type: object
      required:
        - hashes
      properties:
        hashes:
          type: array
          items:
            type: string
          example:
            - "abc123def456"
            - "789xyz000111"

    BatchCancelResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CancelResult'

    CancelResult:
      type: object
      required:
        - hash
        - status
      properties:
        hash:
          type: string
          example: "abc123def456"
        status:
          type: string
          example: "cancelled"

    SetCredentialsRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "adminadmin"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid request format"
