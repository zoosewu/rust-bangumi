version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 數據庫
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: bangumi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # 只在 initdb（首次建立 cluster）時生效：讓 Postgres 能偵測頁面損壞
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # 必須是 Docker 管理的 volume（落在 Docker/OrbStack VM 自己的磁碟上）。
      # 不可 bind mount 到 macOS 外接硬碟：2026-09～10 生產環境在該配置下出現
      # 寫入遺失（索引缺列、主鍵重複、序列倒退），見
      # docs/runbooks/2026-10-16-production-environment-audit.md E1。
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init-viewer-db.sh:/docker-entrypoint-initdb.d/02-init-viewer-db.sh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.2
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 每天備份資料庫到 ./data/backups（外接硬碟），保留 14 天、每個資料庫至少留最新 3 份。
  # 資料庫本身在 Docker volume（內建磁碟），備份放在另一顆磁碟上，見 scripts/db-backup.sh。
  # 立即備份一次：docker exec -e BACKUP_ONCE=1 bangumi-db-backup sh /usr/local/bin/db-backup.sh
  db-backup:
    image: postgres:15-alpine
    container_name: bangumi-db-backup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DATABASES: ${POSTGRES_DB:?POSTGRES_DB is required} viewer_jellyfin
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
    volumes:
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - ./data/backups:/backups
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 核心服務
  # ============================================================================
  core-service:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: bangumi-core
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      CORE_SERVICE_URL: http://core-service:${CORE_PORT:-8000}
      SERVICE_PORT: ${CORE_PORT:-8000}
      RUST_LOG: ${RUST_LOG:-core_service=info}
      RUST_BACKTRACE: "0"
      # 異常通知裡的時間用這個時區（log 的時間戳記固定是 UTC）
      TZ: ${TZ:-Asia/Taipei}
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${CORE_PORT:-8000}:${CORE_PORT:-8000}"
    volumes:
      # 唯讀：完成時的影片 / 字幕挑選與合集逐集配對都要讀 qBittorrent 的下載目錄
      # （路徑需與 qBittorrent 回報的 content_path 一致，皆為 /downloads/...）
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR is required}:/downloads:ro
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.10
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CORE_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Fetcher - Mikanani
  # ============================================================================
  fetcher-mikanani:
    build:
      context: .
      dockerfile: Dockerfile.fetcher-mikanani
    container_name: bangumi-fetcher-mikanani
    depends_on:
      core-service:
        condition: service_healthy
    environment:
      CORE_SERVICE_URL: http://core-service:${CORE_PORT:-8000}
      SERVICE_PORT: ${FETCHER_PORT:-8001}
      RUST_LOG: ${RUST_LOG:-fetcher_mikanani=info}
      RUST_BACKTRACE: "0"
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${FETCHER_PORT:-8001}:${FETCHER_PORT:-8001}"
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.11
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FETCHER_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Downloader - qBittorrent
  # ============================================================================
  downloader-qbittorrent:
    build:
      context: .
      dockerfile: Dockerfile.downloader-qbittorrent
    container_name: bangumi-downloader-qbittorrent
    depends_on:
      core-service:
        condition: service_healthy
    environment:
      CORE_SERVICE_URL: http://core-service:${CORE_PORT:-8000}
      SERVICE_HOST: downloader-qbittorrent
      SERVICE_PORT: ${DOWNLOADER_PORT:-8002}
      QBITTORRENT_URL: http://qbittorrent:${QBITTORRENT_WEBUI_PORT:-8080}
      QBITTORRENT_USER: ${QBITTORRENT_USER:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-downloader_qbittorrent=info}
      RUST_BACKTRACE: "0"
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${DOWNLOADER_PORT:-8002}:${DOWNLOADER_PORT:-8002}"
    volumes:
      # 唯讀：回報完成狀態時要列出 content_path 底下的檔案
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR is required}:/downloads:ro
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.12
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DOWNLOADER_PORT:-8002}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Viewer - Jellyfin
  # ============================================================================
  viewer-jellyfin:
    build:
      context: .
      dockerfile: Dockerfile.viewer-jellyfin
    container_name: bangumi-viewer-jellyfin
    depends_on:
      core-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      metadata:
        condition: service_started
    environment:
      VIEWER_DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/viewer_jellyfin
      DOWNLOADS_DIR: /downloads
      JELLYFIN_LIBRARY_DIR: /media/jellyfin
      CORE_SERVICE_URL: http://core-service:${CORE_PORT:-8000}
      SERVICE_HOST: viewer-jellyfin
      SERVICE_PORT: ${VIEWER_PORT:-8003}
      METADATA_SERVICE_URL: http://metadata:${METADATA_PORT:-8005}
      RUST_LOG: ${RUST_LOG:-viewer_jellyfin=info}
      RUST_BACKTRACE: "0"
      LANGUAGE_CODES_PATH: /etc/bangumi/language_codes.json
    ports:
      - "${VIEWER_PORT:-8003}:${VIEWER_PORT:-8003}"
    volumes:
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR is required}:/downloads
      - ${JELLYFIN_LIBRARY_DIR:?JELLYFIN_LIBRARY_DIR is required}:/media/jellyfin
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.13
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VIEWER_PORT:-8003}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Metadata Service - Bangumi.tv 元資料查詢
  # ============================================================================
  metadata:
    build:
      context: .
      dockerfile: Dockerfile.metadata
    container_name: bangumi-metadata
    depends_on:
      core-service:
        condition: service_healthy
    environment:
      CORE_SERVICE_URL: http://core-service:${CORE_PORT:-8000}
      SERVICE_HOST: metadata
      SERVICE_PORT: ${METADATA_PORT:-8005}
      RUST_LOG: ${RUST_LOG:-metadata_service=info}
      RUST_BACKTRACE: "0"
    ports:
      - "${METADATA_PORT:-8005}:${METADATA_PORT:-8005}"
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.14
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${METADATA_PORT:-8005}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # Frontend (Caddy + SPA)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bangumi-frontend
    depends_on:
      core-service:
        condition: service_healthy
    environment:
      CORE_PORT: ${CORE_PORT:-8000}
      DOWNLOADER_PORT: ${DOWNLOADER_PORT:-8002}
      VIEWER_PORT: ${VIEWER_PORT:-8003}
    ports:
      - "${FRONTEND_PORT:-8004}:80"
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.30
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Downloader - PikPak
  # ============================================================================
  pikpak-downloader:
    build:
      context: .
      dockerfile: Dockerfile.downloader-pikpak
    container_name: bangumi-downloader-pikpak
    depends_on:
      core-service:
        condition: service_healthy
    environment:
      CORE_SERVICE_URL: http://core-service:${CORE_PORT:-8000}
      SERVICE_HOST: pikpak-downloader
      SERVICE_PORT: ${PIKPAK_PORT:-8006}
      PIKPAK_EMAIL: ${PIKPAK_EMAIL:-}
      PIKPAK_PASSWORD: ${PIKPAK_PASSWORD:-}
      PIKPAK_DB_PATH: /data/pikpak.db
      RUST_LOG: ${RUST_LOG:-downloader_pikpak=info}
      RUST_BACKTRACE: "0"
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${PIKPAK_PORT:-8006}:${PIKPAK_PORT:-8006}"
    volumes:
      - ${PIKPAK_DATA_DIR:?PIKPAK_DATA_DIR is required}:/data
    networks:
      bangumi-network:
        ipv4_address: 172.25.0.16
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PIKPAK_PORT:-8006}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:

# ============================================================================
# 網絡
# ============================================================================
networks:
  bangumi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

